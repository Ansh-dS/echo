services: 
  postgres:
    image: postgres:16-alpine
    container_name: echo_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: echo_admin
      POSTGRES_PASSWORD: echo_password
      POSTGRES_DB: echo_db
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: echo_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass echo_password
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: 


