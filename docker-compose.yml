services: 
  postgres:
    image: postgres:16-alpine
    container_name: echo_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: echo_admin
      POSTGRES_PASSWORD: echo_password
      POSTGRES_DB: echo_db
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:


